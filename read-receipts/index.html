<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read Receipts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: Nora's phone on the left, your case notes on the right, like a plain form on a desk. */
:root{
  --paper:#f4f5f6;
  --sheet:#ffffff;
  --ink:#1c2024;
  --muted:#5e6770;
  --rule:#d6dadf;
  --mark:#f3e15a;         /* highlighter, used only for evidence */
  --mark-ink:#2b2600;
  --link:#1f5fa6;
  --ok:#2c7a4b;
  --bad:#b3261e;
  --sans:"Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  /* phone, light mode */
  --ph-bg:#ffffff;
  --ph-1:#f2f2f7;
  --ph-2:#e5e5ea;
  --ph-sep:#d8d8dc;
  --ph-text:#000000;
  --ph-sub:#6e6e73;
  --ph-link:#0a66d8;
  --me:#0a7cff;
  --me-text:#ffffff;
  --them:#e9e9eb;
  --them-text:#000000;
  --wh-me:#2f7d5b;
  --wh-them:#e4ece8;
  --wh-link:#2f7d5b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16191c; --sheet:#1d2125; --ink:#e7e9eb; --muted:#9ca5ad; --rule:#30363c;
    --mark:#6b5f12; --mark-ink:#fff5b8; --link:#86b6ee; --ok:#6fc392; --bad:#ff8a80;
    --ph-bg:#000000; --ph-1:#1c1c1e; --ph-2:#2c2c2e; --ph-sep:#38383a; --ph-text:#ffffff; --ph-sub:#8e8e93;
    --ph-link:#4ea1ff; --me:#0a7cff; --them:#262628; --them-text:#ffffff; --wh-me:#2f7d5b; --wh-them:#22302a; --wh-link:#6fc392;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16191c; --sheet:#1d2125; --ink:#e7e9eb; --muted:#9ca5ad; --rule:#30363c;
  --mark:#6b5f12; --mark-ink:#fff5b8; --link:#86b6ee; --ok:#6fc392; --bad:#ff8a80;
  --ph-bg:#000000; --ph-1:#1c1c1e; --ph-2:#2c2c2e; --ph-sep:#38383a; --ph-text:#ffffff; --ph-sub:#8e8e93;
  --ph-link:#4ea1ff; --me:#0a7cff; --them:#262628; --them-text:#ffffff; --wh-me:#2f7d5b; --wh-them:#22302a; --wh-link:#6fc392;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; overflow:hidden}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--link); outline-offset:2px}
#app{height:100%; display:flex; flex-direction:column}

/* top bar */
.topbar{position:relative; display:flex; align-items:baseline; gap:16px; padding:12px 24px 10px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.brand{font-weight:800; font-size:20px; letter-spacing:-.2px}
.casemeta{font-size:13px; color:var(--muted)}
.topbar .spacer{flex:1}
.tabs{display:none; gap:0; border:1px solid var(--rule); border-radius:6px; overflow:hidden}
.tabs button{border:0; background:var(--sheet); padding:6px 12px; font-size:13px; cursor:pointer; color:var(--muted)}
.tabs button + button{border-left:1px solid var(--rule)}
.tabs button[aria-pressed="true"]{color:var(--ink); font-weight:600; background:var(--paper)}

.sbtn{border:1px solid var(--rule); background:var(--sheet); color:var(--ink); border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer}
.sbtn[aria-pressed="true"]{border-color:var(--ink); font-weight:600}
#soundPanel{position:absolute; right:24px; top:calc(100% + 6px); z-index:90; width:290px; max-width:calc(100vw - 32px); box-sizing:border-box; background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; box-shadow:0 12px 30px rgba(0,0,0,.18); display:flex; flex-direction:column; gap:12px; font-size:14px}
#soundPanel h3{margin:0; font-size:15px}
#soundPanel .srcline{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
#soundPanel label.row2{display:flex; align-items:center; gap:10px}
#soundPanel input[type=range]{flex:1; accent-color:var(--ink)}
#soundPanel .filebtn{display:inline-block; border:1px solid var(--rule); border-radius:5px; padding:6px 11px; cursor:pointer; background:var(--paper)}
#soundPanel .filebtn:focus-within{outline:2px solid var(--link)}
#soundPanel .filebtn input{position:absolute; opacity:0; width:1px; height:1px}
#soundPanel .note{font-size:12.5px; color:var(--muted); margin:0}

/* stage */
.stage{flex:1; min-height:0; display:grid; grid-template-columns:auto minmax(0,1fr); gap:32px; padding:20px 24px; max-width:1240px; width:100%; margin:0 auto; box-sizing:border-box}
.phone-wrap{display:flex; align-items:flex-start; justify-content:center; min-height:0; height:100%}

.phone{
  position:relative; width:380px; height:min(820px, 100%);
  border-radius:48px; border:10px solid #111; background:var(--ph-bg);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.45);
  overflow:hidden; font-family:var(--ui); color:var(--ph-text); box-sizing:border-box;
}
.phone.buzz{animation:buzz .5s}
@keyframes buzz{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.notch{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:110px; height:30px; background:#000; border-radius:16px; z-index:30}
.status{position:absolute; top:0; left:0; right:0; height:46px; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0 32px; font-size:15px; font-weight:600; z-index:25; pointer-events:none; color:var(--ph-text)}
.status.light{color:#fff}
.status .icons{display:flex; gap:6px; align-items:center; font-size:12px}
.battery{width:23px; height:11px; border:1.5px solid currentColor; border-radius:3px; position:relative; box-sizing:border-box; opacity:.8}
.battery::after{content:""; position:absolute; left:1px; top:1px; bottom:1px; width:4px; background:#e5483d; border-radius:1px}
.homebar{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:130px; height:5px; border-radius:3px; background:var(--ph-text); opacity:.55; z-index:30; border:0; padding:0; cursor:pointer}
.homebar.light{background:#fff}
#screen{position:absolute; inset:0; display:flex; flex-direction:column}
.view{display:flex; flex-direction:column; height:100%; min-height:0; padding-top:46px; box-sizing:border-box; background:var(--ph-bg)}
.vhead{padding:4px 14px 8px; display:flex; align-items:center; gap:8px; min-height:42px; box-sizing:border-box; border-bottom:1px solid var(--ph-sep)}
.vhead.plain{border-bottom:0}
.vhead h1{font-size:17px; font-weight:600; margin:0; flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bigtitle{font-size:30px; font-weight:700; margin:0; padding:0 16px 4px; letter-spacing:-.4px}
.back{border:0; background:none; color:var(--ph-link); font-size:17px; cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:3px; min-width:70px}
.back svg{width:11px; height:19px}
.hbtn{border:0; background:none; color:var(--ph-link); font-size:15px; cursor:pointer; min-width:70px; text-align:right; padding:4px 0}
.vbody{flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; padding-bottom:30px}
.whisper .back,.whisper .hbtn{color:var(--wh-link)}

/* lock screen */
.lock{height:100%; position:relative; color:#fff; display:flex; flex-direction:column; align-items:center; overflow:hidden}
.lock .wall{position:absolute; inset:0}
.lock .wall svg{width:100%; height:100%; display:block}
.lock .shade{position:absolute; inset:0; background:rgba(0,0,0,.38)}
.lock > *:not(.wall):not(.shade):not(.pin){position:relative}
.lk-date{margin-top:60px; font-size:18px; font-weight:500}
.lk-time{font-size:80px; font-weight:600; line-height:1; letter-spacing:-2px}
.lk-notifs{width:calc(100% - 24px); margin-top:16px; display:flex; flex-direction:column; gap:6px}
.lk-n{background:rgba(245,245,247,.92); color:#000; border-radius:14px; padding:8px 12px; font-size:13px}
.lk-n b{display:flex; justify-content:space-between; font-weight:600}
.lk-n b span{font-weight:400; color:#6e6e73; font-size:12px}
.lk-n p{margin:1px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lk-more{font-size:12.5px; text-align:center; opacity:.9}
.lk-open{margin-top:auto; margin-bottom:30px; border:0; background:rgba(255,255,255,.9); color:#000; padding:9px 20px; border-radius:20px; cursor:pointer; font-size:15px; font-weight:500}
.pin{position:absolute; inset:0; background:#101214; color:#fff; display:flex; flex-direction:column; align-items:center; padding-top:84px; z-index:5}
.pin h2{font-size:19px; font-weight:500; margin:0 0 6px}
.pin .sub{font-size:13px; color:#a1a1a6; min-height:20px; text-align:center; padding:0 30px}
.dots{display:flex; gap:20px; margin:20px 0 26px}
.dots i{width:13px; height:13px; border-radius:50%; border:1.5px solid #fff; box-sizing:border-box}
.dots i.on{background:#fff}
.dots.shake{animation:buzz .4s}
.keypad{display:grid; grid-template-columns:repeat(3,74px); gap:14px 22px}
.key{width:74px; height:74px; border-radius:50%; border:0; background:#2c2f33; color:#fff; font-size:30px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.key small{font-size:9.5px; letter-spacing:1.5px; font-weight:600; margin-top:2px; color:#c7c7cc}
.key:active{background:#4a4e53}
.key.ghost{background:transparent; font-size:16px}
.pin .cancel{margin-top:16px; border:0; background:none; color:#fff; font-size:16px; cursor:pointer}
.whisper .pin{background:#0f1a15}
.whisper .key{background:#21342b}

/* home */
.home{height:100%; background:#34505c; display:flex; flex-direction:column; padding-top:46px; box-sizing:border-box; color:#fff}
.apps{display:grid; grid-template-columns:repeat(4,1fr); gap:20px 6px; padding:22px 16px}
.app{border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; font-size:11.5px; color:#fff; position:relative}
.ico{width:58px; height:58px; border-radius:14px; display:flex; align-items:center; justify-content:center}
.ico svg{width:32px; height:32px}
.badge{position:absolute; top:-6px; right:2px; background:#ff3b30; color:#fff; font-size:12px; font-weight:600; border-radius:11px; min-width:22px; height:22px; display:flex; align-items:center; justify-content:center; padding:0 6px; box-sizing:border-box}
.home-wid{margin:0 16px; background:rgba(0,0,0,.25); border-radius:16px; padding:12px 14px; font-size:13.5px; line-height:1.4}
.home-wid b{display:block; font-size:13px; margin-bottom:3px; color:#cfe0e6}
.dock{margin:auto 12px 22px; background:rgba(255,255,255,.16); border-radius:26px; padding:12px 8px; display:grid; grid-template-columns:repeat(4,1fr)}
.dock .app > span:last-child{display:none}

/* lists */
.search{margin:6px 16px 8px; display:flex; align-items:center; gap:6px; background:var(--ph-1); border-radius:10px; padding:7px 10px; color:var(--ph-sub)}
.search input{flex:1; border:0; background:transparent; color:var(--ph-text); font:inherit; font-size:16px; outline:none; min-width:0}
.row{display:flex; gap:12px; padding:9px 16px; align-items:center; border:0; background:none; width:100%; text-align:left; cursor:pointer; color:inherit; font:inherit; position:relative}
.row:active{background:var(--ph-1)}
.row .rbody{flex:1; min-width:0; border-bottom:1px solid var(--ph-sep); padding-bottom:9px; margin-bottom:-9px}
.row .rtop{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
.row .rname{font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .rtime{color:var(--ph-sub); font-size:14px; white-space:nowrap}
.row .rprev{color:var(--ph-sub); font-size:14.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.unread-dot{position:absolute; left:4px; top:50%; width:9px; height:9px; margin-top:-4px; border-radius:50%; background:var(--ph-link)}
.whisper .unread-dot{background:var(--wh-me)}
.av{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:15px; color:#fff; flex:none; background:#8e8e93}
.av.sm{width:28px; height:28px; font-size:11px}
.sect{font-size:13px; color:var(--ph-sub); padding:16px 16px 6px}
.folder{display:flex; align-items:center; gap:10px; padding:12px 16px; color:var(--ph-link); border:0; background:none; width:100%; cursor:pointer; font:inherit; font-size:16px; border-top:1px solid var(--ph-sep); margin-top:10px}
.folder .n{margin-left:auto; color:var(--ph-sub)}

/* thread */
.thead{flex-direction:column; gap:2px; padding-top:0; position:relative}
.thead .back{position:absolute; left:10px; top:6px}
.thead .tname{font-size:12px}
.msgs{padding:6px 12px 16px; display:flex; flex-direction:column; gap:2px}
.day{align-self:center; font-size:11.5px; color:var(--ph-sub); margin:14px 0 6px; text-align:center}
.day b{font-weight:600}
.bw{display:flex; flex-direction:column; max-width:78%; position:relative}
.bw.me{align-self:flex-end; align-items:flex-end}
.bw.them{align-self:flex-start; align-items:flex-start}
.bw .who{font-size:11px; color:var(--ph-sub); margin:6px 0 1px 12px}
.bubble{border:0; font:inherit; text-align:left; padding:7px 12px; border-radius:18px; font-size:15.5px; line-height:1.32; cursor:pointer; position:relative; white-space:pre-wrap; overflow-wrap:anywhere}
.bw.me .bubble{background:var(--me); color:var(--me-text)}
.bw.them .bubble{background:var(--them); color:var(--them-text)}
.whisper .bw.me .bubble{background:var(--wh-me); color:#fff}
.whisper .bw.them .bubble{background:var(--wh-them); color:var(--ph-text)}
.bw.sys{align-self:center; max-width:90%}
.bw.sys .bubble{background:transparent!important; color:var(--ph-sub)!important; font-size:12px; text-align:center; cursor:default}
.bubble.marked{outline:3px solid var(--mark); outline-offset:1px}
.bubble.sel{outline:2px dashed var(--ph-sub); outline-offset:2px}
.bubble.hl{animation:hl 2.2s}
@keyframes hl{0%,50%{outline:3px solid #ffb300; outline-offset:2px}100%{outline:3px solid transparent}}
.btime{font-size:11px; color:var(--ph-sub); margin:2px 6px 0}
.flagbtn{margin-top:5px; border:1px solid var(--ph-sep); background:var(--ph-bg); color:var(--ph-text); border-radius:14px; padding:4px 12px; font-size:13px; cursor:pointer; font-family:var(--ui)}
.flagbtn .sw{display:inline-block; width:10px; height:10px; background:var(--mark); border:1px solid #c9b52e; margin-right:6px; vertical-align:-1px}
.receipt{align-self:flex-end; font-size:11px; color:var(--ph-sub); margin:2px 4px 0}
.typing{align-self:flex-start; background:var(--them); border-radius:18px; padding:10px 14px; display:flex; gap:4px; margin-top:4px}
.whisper .typing{background:var(--wh-them)}
.typing i{width:7px; height:7px; border-radius:50%; background:var(--ph-sub); animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
.compose{border-top:1px solid var(--ph-sep); padding:8px 12px 24px; display:flex; flex-direction:column; gap:6px; background:var(--ph-bg)}
.compose .fake{border:1px solid var(--ph-sep); border-radius:18px; padding:7px 14px; color:var(--ph-sub); font-size:14px}
.choice{border:1px solid var(--ph-link); background:transparent; color:var(--ph-link); border-radius:16px; padding:8px 12px; font-size:14.5px; text-align:left; cursor:pointer}
.whisper .choice{border-color:var(--wh-link); color:var(--wh-link)}
.choice.quiet{border-style:dashed; color:var(--ph-sub); border-color:var(--ph-sep)}
.choice-label{font-size:12px; color:var(--ph-sub)}

/* notes, mail */
.doc{padding:14px 18px 28px; font-size:16px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere}
.doc .meta{font-size:12.5px; color:var(--ph-sub); text-align:center; margin-bottom:12px; white-space:normal}
.doc h2{font-size:22px; margin:0 0 10px; font-weight:700; white-space:normal}
.doc.marked h2{background:var(--mark); color:var(--mark-ink); display:inline; padding:0 3px}
.mailhead{padding:12px 18px; border-bottom:1px solid var(--ph-sep); font-size:14px; color:var(--ph-sub)}
.mailhead b{color:var(--ph-text); font-weight:600}
.mailhead h2{color:var(--ph-text); font-size:19px; margin:6px 0 0; line-height:1.25}
.itemflag{display:flex; justify-content:center; padding:4px 16px 16px}
.lockednote{display:flex; flex-direction:column; align-items:center; gap:10px; padding:50px 24px; text-align:center}
.lockednote input{width:100%; box-sizing:border-box; border-radius:10px; border:1px solid var(--ph-sep); background:var(--ph-1); color:var(--ph-text); padding:10px 12px; font-size:16px}
.lockednote button.go{border:0; background:var(--ph-link); color:#fff; padding:9px 20px; border-radius:10px; font-weight:600; cursor:pointer}
.lockednote .err{color:#d70015; font-size:13px; min-height:18px}

/* photos */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px}
.thumb{border:0; padding:0; aspect-ratio:1; overflow:hidden; cursor:pointer; background:#ccc; position:relative; max-width:100%}
.thumb svg{width:100%; height:100%; display:block}
.thumb.marked::after{content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 4px var(--mark)}
.photo-full .pic svg{width:100%; height:auto; display:block}
.photo-full .pic.marked{outline:4px solid var(--mark); outline-offset:-4px}
.exif{margin:12px 16px; background:var(--ph-1); border-radius:12px; padding:12px 14px; font-size:13.5px; color:var(--ph-sub); display:grid; gap:3px}
.exif b{color:var(--ph-text); font-weight:600}
.caption{padding:8px 18px 0; font-size:15px}

/* phone app */
.seg{display:flex; margin:4px 16px 8px; background:var(--ph-1); border-radius:9px; padding:2px}
.seg button{flex:1; border:0; background:transparent; padding:6px; border-radius:7px; font-size:13px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ph-bg); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.15)}
.rname.missed{color:#ff3b30}
.callinfo{font-size:13px; color:var(--ph-sub)}
.vm .transcript{margin:2px 16px 12px; background:var(--ph-1); border-radius:12px; padding:12px; font-size:14.5px; line-height:1.45}
.vm .transcript.marked{outline:3px solid var(--mark)}
.vm .transcript small{display:block; color:var(--ph-sub); font-size:12px; margin-bottom:6px}

/* maps */
.map{border-bottom:1px solid var(--ph-sep)}
.map svg{display:block; width:100%; height:auto}
.locrow{display:flex; gap:12px; padding:10px 16px; border:0; background:none; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit; align-items:flex-start; border-bottom:1px solid var(--ph-sep)}
.locrow .lt{font-size:13px; color:var(--ph-sub); min-width:94px; font-variant-numeric:tabular-nums}
.locrow .ln{font-size:15px; flex:1; min-width:0}
.locrow .ln small{display:block; color:var(--ph-sub); font-size:12.5px}
.locrow.sysrow{cursor:default}
.locrow.sysrow .ln{color:var(--ph-sub); font-size:13.5px}
.locrow.on{background:var(--ph-1)}
.locrow.marked .ln .lbl{background:var(--mark); color:var(--mark-ink); padding:0 3px}
.mapday{font-size:13px; font-weight:600; padding:14px 16px 6px; color:var(--ph-sub)}

/* search */
.res{display:block; width:100%; text-align:left; border:0; background:none; color:inherit; padding:10px 16px; border-bottom:1px solid var(--ph-sep); cursor:pointer; font:inherit}
.res .src{font-size:12.5px; color:var(--ph-sub)}
.res .snip{font-size:14.5px; margin-top:2px}
.res mark{background:#ffe066; color:#000; border-radius:2px; padding:0 1px}
.empty{color:var(--ph-sub); text-align:center; padding:40px 24px; font-size:14.5px}

/* banner */
#banner{position:absolute; top:44px; left:8px; right:8px; z-index:40; transform:translateY(-150%); transition:transform .3s ease-out; pointer-events:none}
#banner.show{transform:translateY(0); pointer-events:auto}
#banner button{width:100%; text-align:left; border:0; background:#f2f2f7; color:#000; border-radius:16px; padding:10px 14px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25); font-family:var(--ui)}
#banner small{display:flex; justify-content:space-between; color:#6e6e73; font-size:12px}
#banner b{display:block; font-size:14.5px; margin-top:1px}
#banner p{margin:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* case notes */
.board{min-height:0; overflow-y:auto; padding:2px 4px 30px 0}
.board > section{padding:0 0 22px; margin-bottom:22px; border-bottom:1px solid var(--rule)}
.board > section:last-child{border-bottom:0}
.board h2{font-size:24px; font-weight:800; margin:0; letter-spacing:-.3px; line-height:1.2}
.board h3{font-size:16px; font-weight:700; margin:0 0 10px}
.board .lede{color:var(--muted); margin:4px 0 0; max-width:62ch}
.formrow{display:flex; flex-wrap:wrap; gap:6px 28px; margin-top:12px; font-size:14px}
.formrow div{min-width:120px}
.formrow span{display:block; font-size:12px; color:var(--muted)}
.formrow b{font-variant-numeric:tabular-nums}
.objs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.objs li{display:flex; gap:10px; align-items:flex-start; font-size:15px}
.objs .box{width:15px; height:15px; border:1.5px solid var(--muted); border-radius:2px; flex:none; margin-top:3px; box-sizing:border-box; position:relative}
.objs li.done{color:var(--muted)}
.objs li.done .t{text-decoration:line-through}
.objs li.done .box::after{content:""; position:absolute; left:3px; top:0; width:4px; height:8px; border:solid var(--ok); border-width:0 2px 2px 0; transform:rotate(45deg)}
.objs li.cur{font-weight:600}
.objs li.cur .box{border-color:var(--ink)}
.objs li.later{color:var(--muted)}
.hintbox{margin-top:12px; display:flex; flex-direction:column; gap:6px; max-width:62ch}
.hint{font-size:14.5px; color:var(--ink); background:var(--sheet); border:1px solid var(--rule); border-radius:4px; padding:7px 10px}
.btn{border:1px solid var(--rule); background:var(--sheet); color:var(--ink); border-radius:5px; padding:7px 13px; cursor:pointer; font-size:14px; font-family:var(--sans)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600}
.btn.small{padding:4px 9px; font-size:13px}
.btn.linky{border:0; background:none; color:var(--link); padding:0; text-decoration:underline; text-underline-offset:3px}
.btabs{display:flex; gap:18px; border-bottom:1px solid var(--rule); margin:0 0 14px}
.btabs button{border:0; background:none; padding:6px 0; cursor:pointer; color:var(--muted); font-size:15px; border-bottom:2px solid transparent; margin-bottom:-1px}
.btabs button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--ink); font-weight:600}
.ev{padding:11px 0; border-top:1px solid var(--rule)}
.ev:first-child{border-top:0; padding-top:0}
.ev h4{margin:0; font-size:15px; font-weight:600; display:inline; background:var(--mark); color:var(--mark-ink); padding:0 3px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.ev p{margin:4px 0 0; font-size:14.5px; max-width:62ch}
.ev .src{font-size:12.5px; color:var(--muted); margin-top:5px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.ev.fresh{animation:fresh 1.6s}
@keyframes fresh{0%{background:var(--sheet)}100%{background:transparent}}
.people{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
.person{border:1px solid var(--rule); border-radius:4px; padding:11px 13px; background:var(--sheet)}
.person h4{margin:0; font-size:15px}
.person .role{font-size:12.5px; color:var(--muted)}
.person ul{margin:6px 0 0; padding-left:17px; font-size:14px}
.person ul li{margin:2px 0}
.tl{list-style:none; margin:0; padding:0}
.tl li{display:grid; grid-template-columns:118px minmax(0,1fr); gap:12px; padding:6px 0; border-top:1px solid var(--rule); font-size:14.5px}
.tl li:first-child{border-top:0}
.tl time{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.empty-b{color:var(--muted); font-size:14.5px}

/* modal */
#modal{position:fixed; inset:0; background:rgba(10,12,14,.6); z-index:100; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:36px 16px}
.sheet{background:var(--sheet); border:1px solid var(--rule); border-radius:6px; max-width:640px; width:100%; padding:26px 28px; box-sizing:border-box}
.sheet h2{font-size:28px; font-weight:800; line-height:1.15; margin:0 0 6px; letter-spacing:-.4px}
.sheet .kicker{font-size:13px; color:var(--muted)}
.letter{background:#fbfbf8; color:#22262a; border:1px solid #dcdcd5; padding:22px 24px; font-family:Georgia, "Times New Roman", serif; font-size:17px; line-height:1.6; margin:16px 0}
.letter p{margin:0 0 12px}
.letter .post{font-family:var(--sans); font-size:13px; color:#5e6770; margin-bottom:12px}
.sticky{display:inline-block; background:#fff07a; color:#2a2410; padding:8px 12px; transform:rotate(-1.5deg); font-family:"Marker Felt","Bradley Hand","Segoe Print",cursive; font-size:19px; margin:2px 0 8px; box-shadow:0 2px 4px rgba(0,0,0,.15)}
.sheet .actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:18px}
.q{border-top:1px solid var(--rule); padding:14px 0 4px}
.q fieldset{border:0; margin:0; padding:0; min-width:0}
.q legend{font-weight:600; font-size:15.5px; margin-bottom:6px; padding:0}
.opt{display:flex; gap:10px; align-items:flex-start; padding:5px 6px; border-radius:4px; cursor:pointer; font-size:14.5px}
.opt:hover{background:var(--paper)}
.opt input{margin-top:4px}
.result{display:flex; gap:28px; flex-wrap:wrap; margin:12px 0 16px; font-size:13px; color:var(--muted)}
.result b{display:block; font-size:26px; color:var(--ink); font-variant-numeric:tabular-nums}
.epi p{font-size:16px; line-height:1.6; margin:0 0 12px; max-width:62ch}
.answers{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:8px; font-size:14.5px}
.answers li{display:grid; grid-template-columns:20px minmax(0,1fr); gap:6px}
.answers .ok{color:var(--ok); font-weight:700} .answers .no{color:var(--bad); font-weight:700}
.answers small{display:block; color:var(--muted)}
details.truth{margin-top:16px; border-top:1px solid var(--rule); padding-top:12px}
details.truth summary{cursor:pointer; font-weight:600}
details.truth p{font-size:15px; line-height:1.6; max-width:62ch}
.warnline{font-size:14px; color:var(--bad); margin-top:6px}

#toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,calc(100% + 40px)); visibility:hidden; background:var(--ink); color:var(--paper); padding:9px 15px; border-radius:6px; z-index:120; max-width:min(440px, calc(100% - 32px)); box-sizing:border-box; font-size:14px; transition:transform .25s}
#toast.show{transform:translate(-50%,0); visibility:visible}
#toast b{font-weight:700}

@media (max-width: 900px){
  .topbar{padding:10px 16px; gap:10px; align-items:center}
  #soundPanel{right:16px}
  .casemeta{display:none}
  .tabs{display:flex}
  .stage{display:block; padding:10px 16px 12px}
  .phone{width:100%; max-width:420px; height:100%; border-width:7px; border-radius:38px}
  .board{display:none; height:100%}
  body.show-board .board{display:block}
  body.show-board .phone-wrap{display:none}
  .sheet{padding:20px 18px}
  .tl li{grid-template-columns:96px minmax(0,1fr)}
}
@media (max-width: 380px){
  .keypad{grid-template-columns:repeat(3,66px); gap:12px 18px}
  .key{width:66px; height:66px}
  .apps{gap:16px 2px; padding:18px 8px}
  .ico{width:52px; height:52px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important; transition:none!important}
}

function parseT(t, y){ const [md,hm] = t.split(' '); const [m,d] = md.split('-').map(Number); const [h,mi] = hm.split(':').map(Number); return new Date(y || 2026, m-1, d, h, mi); }
function fmtClock(d){ let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; }
function fmtShort(d){ return `${MON[d.getMonth()]} ${d.getDate()}`; }
function fmtDayLine(d){ return `${DOW[d.getDay()]}, ${fmtShort(d)}`; }
function fmtLong(d){ return `${MONL[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} at ${fmtClock(d)}`; }
function gameNow(){ const base = new Date(2026, NOW0.m-1, NOW0.d, NOW0.h, NOW0.min); const mins = Math.min(240, Math.floor((Date.now() - S.started)/60000)); return new Date(base.getTime() + mins*60000); }
function nowStr(){ const d = gameNow(); return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function listTime(d){
  const n = gameNow(); const days = Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if (days === 0) return fmtClock(d);
  if (days === 1) return 'Yesterday';
  if (days < 7) return DOWL[d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`;
}

// ---------- thread helpers ----------
function msgsOf(tid){ return THREADS[tid].msgs.map(m => ({ t:m[0], from:m[1], text:m[2], clue:m[3] })).concat((S.dyn[tid]||[]).filter(m => m.at <= Date.now())); }

function firstUnread(tid){ const ms = THREADS[tid].msgs; let i = ms.findIndex(m => m[0] > CUTOFF); if (THREADS[tid].app === 'whisper') i = ms.findIndex(m => m[0] > '10-05 06:31'); return i < 0 ? ms.length : i; }
function unread(tid){ const ms = msgsOf(tid); const from = S.readN[tid] ?? firstUnread(tid); return ms.slice(from).filter(m => m.from !== 'me' && m.from !== 'sys').length; }
function lastMsg(tid){ const ms = msgsOf(tid); return ms[ms.length-1]; }
function threadName(tid){ return CONTACTS[THREADS[tid].c].name; }
function pendingFor(tid){ const p = S.pend[tid]; return p && p.at <= Date.now() ? p : null; }

// ---------- clue lookup ----------
const CLUE_SRC = {};
function itemLookup(key){
  const [kind, a, b] = key.split(':');
  if (kind === 'm'){ const m = msgsOf(a)[+b]; return m ? { clue:m.clue } : {}; }
  if (kind === 'note') return { clue:(NOTES.find(n => n.id === a)||{}).clue };
  if (kind === 'mail') return { clue:(MAIL.find(n => n.id === a)||{}).clue };
  if (kind === 'photo') return { clue:(PHOTOS.find(n => n.id === a)||{}).clue };
  if (kind === 'vm') return { clue:(VOICEMAILS.find(n => n.id === a)||{}).clue };
  if (kind === 'call') return { clue:(CALLS[+a]||{}).clue };
  if (kind === 'loc'){ for (const d of LOCDAYS) for (const r of d.rows) if (r.id === a) return { clue:r.clue }; }
  return {};
}
function buildSources(){
  for (const tid in THREADS){
    const app = THREADS[tid].app;
    THREADS[tid].msgs.map(m => ({ clue:m[3] })).concat(S.dyn[tid]||[]).forEach((m, i) => { if (m.clue) CLUE_SRC[m.clue] = { key:`m:${tid}:${i}`, where: app === 'whisper' ? `Whisper, ${threadName(tid)}` : app === 'deleted' ? `Recently Deleted, ${threadName(tid)}` : `Messages, ${threadName(tid)}`, route:{ v:'thread', id:tid, hl:`m:${tid}:${i}` } }; });
  }
  NOTES.forEach(n => n.clue && (CLUE_SRC[n.clue] = { where:`Notes, "${n.title}"`, route:{ v:'note', id:n.id } }));
  MAIL.forEach(n => n.clue && (CLUE_SRC[n.clue] = { where:`Mail, ${n.from}`, route:{ v:'mailv', id:n.id } }));
  PHOTOS.forEach(n => n.clue && (CLUE_SRC[n.clue] = { where:`Photos, ${n.place}`, route:{ v:'photo', id:n.id } }));
  VOICEMAILS.forEach(n => n.clue && (CLUE_SRC[n.clue] = { where:`Voicemail, ${CONTACTS[n.who].name}`, route:{ v:'phone', tab:'vm', open:n.id } }));
  CALLS.forEach((n, i) => n.clue && (CLUE_SRC[n.clue] = { where:'Phone, recent calls', route:{ v:'phone', tab:'recents', sel:`call:${i}` } }));
  LOCDAYS.forEach(d => d.rows.forEach(r => r.clue && (CLUE_SRC[r.clue] = { where:`Maps, ${r.label}`, route:{ v:'maps', sel:r.id } })));
}

// ---------- flagging ----------
function flag(key){

}
function addClue(id){
  if (S.found[id]) return;
  const before = objState().filter(x => x.st === 'done').map(x => x.o.id);
  S.found[id] = ++S.n; UI.fresh = id; save();
  if (typeof Sound !== 'undefined') Sound.mark();
  const after = objState().filter(x => x.st === 'done').map(x => x.o.id);
  const newly = OBJECTIVES.filter(o => after.includes(o.id) && !before.includes(o.id));
  toast(newly.length ? `<b>${esc(CLUES[id].title)}</b> added. Done: ${esc(newly[0].text)}.` : `<b>${esc(CLUES[id].title)}</b> added to your case notes.`);

function runNode(evId, nodeId, startDelay){
  const d = DIALOGS[evId], node = d.nodes[nodeId], tid = d.thread;

  S.dyn[tid] = S.dyn[tid] || [];
  const base = THREADS[tid].msgs.length;
  node.msgs.forEach((m, i) => {
    const o = typeof m === 'string' ? { text:m } : m;
    at += (i === 0 && !startDelay ? 900 : 700) + Math.min(2200, o.text.length * 28);
    const idx = base + S.dyn[tid].length;
    S.dyn[tid].push({ t:nowStr(), from: o.sys ? 'sys' : 'them', text:o.text, clue:o.clue, at });
    if (o.clue) CLUE_SRC[o.clue] = { key:`m:${tid}:${idx}`, where:`${THREADS[tid].app === 'whisper' ? 'Whisper' : 'Messages'}, ${threadName(tid)}`, route:{ v:'thread', id:tid, hl:`m:${tid}:${idx}` } };
  });

  if (node.choices) S.pend[tid] = { ev:evId, node:nodeId, at }; else delete S.pend[tid];

  const p = S.pend[tid];
  if (p && p.at > Date.now()) timers.push(setTimeout(() => { if (viewing(tid)) render(); }, p.at - Date.now() + 40));
  if (list.length && viewing(tid)) render();
  if (last && list.length){
    const endAt = list[list.length-1].at;
    timers.push(setTimeout(() => {

}

    else {
      const target = UI.hl && scr.querySelector(`[data-key="${UI.hl}"]`);

  }

}

function keypad(prefix){
  const L = ['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
  let h = '<div class="keypad">';
  for (let i = 1; i <= 9; i++) h += `<button class="key" data-act="${prefix}" data-d="${i}">${i}<small>${L[i-1]}</small></button>`;
  h += `<span></span><button class="key" data-act="${prefix}" data-d="0">0</button><button class="key ghost" data-act="${prefix}del">Delete</button></div>`;
  return h;
}

// ---------- search ----------
function searchIndex(){
  const out = [];
  for (const tid in THREADS){
    const T = THREADS[tid];
    if (T.app === 'whisper' && !S.wUnlocked) continue;
    const label = T.app === 'whisper' ? `Whisper, ${threadName(tid)}` : T.app === 'deleted' ? `Recently Deleted, ${threadName(tid)}` : `Messages, ${threadName(tid)}`;
    msgsOf(tid).forEach((m, i) => out.push({ label, text:m.text, t:m.t, go:() => jumpRoute({ v:'thread', id:tid, hl:`m:${tid}:${i}` }) }));
  }
  NOTES.forEach(n => { if (!n.locked || S.noteOpen[n.id]) out.push({ label:`Notes, ${n.title}`, text:n.title + '\n' + n.body, t:n.t, go:() => jumpRoute({ v:'note', id:n.id }) }); });
  MAIL.forEach(m => out.push({ label:`Mail, ${m.from}`, text:m.subj + '\n' + m.body + '\n' + m.addr, t:m.t, go:() => jumpRoute({ v:'mailv', id:m.id }) }));
  VOICEMAILS.forEach(v => out.push({ label:`Voicemail, ${CONTACTS[v.who].name}`, text:v.text, t:v.t, go:() => jumpRoute({ v:'phone', tab:'vm', open:v.id }) }));
  CALLS.forEach((c, i) => { const name = c.who === 'augusta' ? CALL_NAMES.augusta : CONTACTS[c.who].name; out.push({ label:'Phone, recent calls', text:name, t:c.t, go:() => jumpRoute({ v:'phone', tab:'recents', sel:`call:${i}` }) }); });
  PHOTOS.forEach(p => out.push({ label:'Photos', text:`${p.place}${p.cap ? '\n' + p.cap : ''}`, t:p.t, go:() => jumpRoute({ v:'photo', id:p.id }) }));
  return out;
}
let lastResults = [];
function searchResults(q){
  q = (q||'').trim();
  if (q.length < 2) return `<div class="empty">Search every message, note, email, voicemail and call on this phone.${S.wUnlocked ? '' : '<br><br>Whisper messages are encrypted and won\'t show up until you unlock the app.'}</div>`;
  const ql = q.toLowerCase().replace(/[()\s-]/g,'');
  const norm = s => s.toLowerCase();
  const digits = /^\d+$/.test(ql);
  lastResults = searchIndex().filter(x => digits ? x.text.replace(/\D/g,'').includes(ql) : norm(x.text).includes(q.toLowerCase()));
  if (!lastResults.length) return `<div class="empty">No results for "${esc(q)}".</div>`;
  return `<p class="sect">${lastResults.length} result${lastResults.length === 1 ? '' : 's'}</p>` + lastResults.slice(0, 80).map((x, i) => {
    const txt = x.text.replace(/\n/g,' ');
    let snip;
    if (digits) snip = esc(txt.length > 140 ? txt.slice(0,140) + '…' : txt);
    else {
      const at = txt.toLowerCase().indexOf(q.toLowerCase());
      const s0 = Math.max(0, at - 50), piece = txt.slice(s0, at + q.length + 80);
      const rel = at - s0;
      snip = (s0 ? '…' : '') + esc(piece.slice(0, rel)) + '<mark>' + esc(piece.slice(rel, rel + q.length)) + '</mark>' + esc(piece.slice(rel + q.length)) + (at + q.length + 80 < txt.length ? '…' : '');
    }
    return `<button class="res" data-act="res" data-i="${i}"><div class="src">${esc(x.label)}, ${fmtShort(parseT(x.t))}</div><div class="snip">${snip}</div></button>`;
  }).join('');
}
function jumpRoute(r){
  const stack = [{v:'home'}, {v:'search'}];
  if (r.v === 'phone'){ UI.phoneTab = r.tab; UI.vmOpen = r.open || null; }
  stack.push(r);
  UI.nav = stack; UI.hl = r.hl || null; UI.sel = r.sel || null;
  render(true);
}

$('#screen').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'back') return back();
  if (a === 'home') return goHome();
  if (a === 'showpin'){ UI.showPin = true; UI.pin = ''; return render(); }
  if (a === 'pincancel'){ UI.showPin = false; return render(); }

function score(ans){

    const a = ans[q.id];

    right[q.id] = ok; if (ok) s++;
  });
  return { s, right };
}

function ending(){
  const R = S.report, F = R.flags, give = R.ans.give, s = R.score;
  const P = [];
  let title;
  const missed = QUESTIONS.filter(q => !q.final && !R.right[q.id]);
  if (give === 1){
    if (s === 6){
      title = 'Cole takes the case';
      P.push('Imani Cole drove up from Augusta that night with two investigators from the DEA\'s diversion office. She read your report in the car.');
      if (F.revealed) P.push('At 10:40 PM a Harrow Point cruiser pulled into Ruth Vance\'s driveway with its headlights off. Cole\'s people were already in the kitchen. Sgt. Dale Pruitt was arrested on the porch.');
      else P.push('Pruitt was arrested Thursday morning at the station, at his own desk.');
      P.push('Glen Hartley was taken out of his campaign office the same morning. ' + (F.owenCoop ? 'Owen had already called Cole on his own. He is cooperating, and his statement is most of the case against his father.' : 'Owen was picked up at the loading door with four bags in the truck.'));
      P.push('The blue tin was under the porch of the Okafor cabin on Lantern Island, where Nora said it would be. The original log pages were inside, wrapped in a bread bag.');
      P.push(F.jessTrust ? 'Jess brought Nora across on the Adaeze on Friday afternoon. Ruth was waiting on the dock, and Biscuit got to her first.' : 'Nora stayed on the island until Cole sent word that it was safe. She came home the following Wednesday.');
      P.push('The federal complaint lists 41 prescriptions. Tyler Gaskin\'s bottle is the first exhibit.');
    } else if (s >= 4){
      title = 'Most of the way there';
      P.push('Cole had the phone, which is what Nora wanted. Your report got some things wrong, though, and she spent three weeks working out what you missed.');
      if (!R.right.who && !R.ans.who.includes(2)) P.push('Because your report didn\'t name Pruitt, he was still on duty when the warrants were drafted. Glen Hartley\'s lawyer knew about them a day early.');
      P.push(F.owenCoop ? 'Owen Hartley called Cole on his own and gave a full statement. That saved the case.' : 'Glen and Owen Hartley were both charged in the end.');
      P.push('Nora came home in early November.');
    } else {
      title = 'The wrong story';
      P.push('Cole had the phone, but your report sent her after the wrong people. By the time she worked out what the messages actually said, the records in the pharmacy safe had been shredded.');
      P.push('Nora stayed on Lantern Island through the first snow.');
    }
  } else if (give === 0){
    title = 'Into the evidence room';
    P.push('Sgt. Pruitt thanked you, wrote out a property receipt, and drove off with the phone. It was logged into the Harrow Point evidence room at 9:52 that night. By morning the entry was gone.');
    P.push('On Friday the department closed Nora\'s case as a probable suicide. Ruth still has the receipt.');
    if (s >= 5) P.push('You had read the deleted messages. You knew who he was when you handed it over.');
    P.push('Nora is still on Lantern Island. Pruitt has started asking about cabins.');
  } else if (give === 2){
    title = 'Front page';
    P.push('The Herald ran the story on Thursday. By that afternoon Glen Hartley\'s lawyer was calling it a smear, and by Friday the records in the pharmacy safe had been "damaged in a flood."');
    P.push('Pruitt was put on paid leave. Cole told Ruth the story gave everyone two days\' warning, and the case might not survive it.');
    P.push('Nora is safe on Lantern Island. She can\'t come home yet.');
  } else {
    title = 'Back in the envelope';
    P.push('You gave the phone back to Ruth and told her what you had found. She put it in the kitchen drawer with the sticky note. With nobody acting on it, nothing changed.');
    if (F.revealed) P.push('On Tuesday night a cruiser parked across the street from Ruth\'s house with its lights off. It came back on Wednesday, and again on Thursday.');
    else P.push('Cole kept writing to the phone on Whisper. Nobody answered.');
  }
  return { title, P, missed };
}

// ===================== SOUND =====================
// Built-in score is generated live with Web Audio: a slow minor pad, a sparse
// piano line with echo, and filtered noise for the sea. Or play your own file.
const SOUND_KEY = 'read-receipts-sound';
const Sound = {
  ctx:null, master:null, musicBus:null, sfxBus:null, playing:false, timer:null, chordI:0,
  pref:{ on:false, vol:0.6, sfx:true },
  own:null, ownName:'',
  loadPref(){ try { Object.assign(this.pref, JSON.parse(localStorage.getItem(SOUND_KEY)) || {}); } catch(e){} },
  savePref(){ try { localStorage.setItem(SOUND_KEY, JSON.stringify(this.pref)); } catch(e){} },
  ensure(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.pref.vol; this.master.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.0001; this.musicBus.connect(this.master);
    this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.5; this.sfxBus.connect(this.master);
    // echo for the piano line
    this.delay = this.ctx.createDelay(2); this.delay.delayTime.value = 0.48;
    const fb = this.ctx.createGain(); fb.gain.value = 0.38;
    const dl = this.ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 1800;
    this.delay.connect(dl); dl.connect(fb); fb.connect(this.delay); dl.connect(this.musicBus);
    return true;
  },
  setVol(v){ this.pref.vol = v; this.savePref(); if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1); if (this.own) this.own.volume = Math.min(1, v); },
  start(){
    if (!this.ensure()) return;
    this.pref.on = true; this.savePref();
    if (this.own){ this.own.volume = Math.min(1, this.pref.vol); this.own.play().catch(() => {}); this.playing = true; return syncSoundUI(); }
    if (this.playing) return;
    this.playing = true;
    const t = this.ctx.currentTime;
    this.musicBus.gain.cancelScheduledValues(t);
    this.musicBus.gain.setValueAtTime(Math.max(0.0001, this.musicBus.gain.value), t);
    this.musicBus.gain.exponentialRampToValueAtTime(0.9, t + 3);
    this.sea();
    this.chordI = 0; this.step();
    this.timer = setInterval(() => this.step(), 8000);
    syncSoundUI();
  },
  stop(){
    this.pref.on = false; this.savePref(); this.playing = false;
    clearInterval(this.timer); this.timer = null;
    if (this.own) this.own.pause();
    if (this.ctx){
      const t = this.ctx.currentTime;
      this.musicBus.gain.cancelScheduledValues(t);
      this.musicBus.gain.setValueAtTime(Math.max(0.0001, this.musicBus.gain.value), t);
      this.musicBus.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
      if (this.seaSrc){ try { this.seaSrc.stop(t + 1.6); } catch(e){} this.seaSrc = null; }
    }
    syncSoundUI();
  },
  hz(m){ return 440 * Math.pow(2, (m - 69) / 12); },
  CHORDS:[ [50,57,60,64,65], [46,53,57,62,65], [41,53,57,60,64], [45,52,55,60,64] ], // Dm9, Bbmaj7, Fmaj7, Am7
  SCALE:[62,65,67,69,72,74,77,79,81],
  step(){
    if (!this.playing || this.own) return;
    const c = this.ctx, t = c.currentTime + 0.05, chord = this.CHORDS[this.chordI++ % this.CHORDS.length];
    chord.forEach((m, i) => this.pad(this.hz(m), t + i * 0.12, 8.6));
    // a few sparse piano notes over each chord
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++){
      if (Math.random() < 0.25) continue;
      const note = this.SCALE[Math.floor(Math.random() * this.SCALE.length)];
      this.piano(this.hz(note), t + 0.8 + i * (1.4 + Math.random() * 1.2));
    }
  },
  pad(f, t, dur){
    const c = this.ctx, g = c.createGain(), lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(950, t + dur / 2); lp.frequency.linearRampToValueAtTime(500, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.035, t + 2.6); g.gain.setValueAtTime(0.035, t + dur - 3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    [-6, 6].forEach(d => { const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = d; o.connect(lp); o.start(t); o.stop(t + dur + 0.1); });
    lp.connect(g); g.connect(this.musicBus);
  },
  piano(f, t){
    const c = this.ctx, g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
    const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2; const g2 = c.createGain(); g2.gain.value = 0.15;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(this.musicBus); g.connect(this.delay);
    o1.start(t); o2.start(t); o1.stop(t + 3); o2.stop(t + 3);
  },
  sea(){
    const c = this.ctx, len = c.sampleRate * 4, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = c.createGain(); g.gain.value = 0.10;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.09; const lg = c.createGain(); lg.gain.value = 0.07;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    src.connect(lp); lp.connect(g); g.connect(this.musicBus); src.start();
    this.seaSrc = src;
  },
  useOwn(file){
    if (!file) return;
    this.ensure();
    if (this.own){ this.own.pause(); URL.revokeObjectURL(this.own.src); }
    const wasPlaying = this.playing;
    if (wasPlaying && !this.own){ this.stop(); }
    this.own = new Audio(URL.createObjectURL(file)); this.own.loop = true; this.ownName = file.name;
    this.playing = false; this.start();
    if (!wasPlaying) syncSoundUI();
  },
  clearOwn(){
    if (!this.own) return;
    const was = this.playing; this.own.pause(); URL.revokeObjectURL(this.own.src); this.own = null; this.ownName = ''; this.playing = false;
    if (was) this.start(); else syncSoundUI();
  },
  // effects
  ding(){
    if (!this.pref.sfx || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    [[1318.5, 0], [1760, 0.11]].forEach(([f, d]) => {
      const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.5);
      o.connect(g); g.connect(this.sfxBus); o.start(t + d); o.stop(t + d + 0.6);
    });
  },
  mark(){
    if (!this.pref.sfx || !this.ctx) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(990, t + 0.08);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(this.sfxBus); o.start(t); o.stop(t + 0.35);
  },
  tap(){
    if (!this.pref.sfx || !this.ctx) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 1200;
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g); g.connect(this.sfxBus); o.start(t); o.stop(t + 0.06);
  },
};

function syncSoundUI(){
  const b = $('#soundBtn'); if (!b) return;
  b.textContent = Sound.playing ? 'Music on' : 'Music off';
  b.setAttribute('aria-pressed', Sound.playing);
  const t = $('#musicToggle'); if (t) t.textContent = Sound.playing ? 'Stop music' : 'Play music';
  const src = $('#musicSrc'); if (src) src.textContent = Sound.own ? `Playing your file: ${Sound.ownName}` : 'Playing the built-in score';
  const cl = $('#ownClear'); if (cl) cl.hidden = !Sound.own;
  const v = $('#vol'); if (v) v.value = Sound.pref.vol;
  const fx = $('#sfx'); if (fx) fx.checked = Sound.pref.sfx;
}
Sound.loadPref();
$('#soundBtn').addEventListener('click', () => { const p = $('#soundPanel'); p.hidden = !p.hidden; Sound.ensure(); syncSoundUI(); });
$('#musicToggle').addEventListener('click', () => Sound.playing ? Sound.stop() : Sound.start());
$('#vol').addEventListener('input', e => Sound.setVol(+e.target.value));
$('#sfx').addEventListener('change', e => { Sound.pref.sfx = e.target.checked; Sound.savePref(); });
$('#ownFile').addEventListener('change', e => { Sound.useOwn(e.target.files[0]); e.target.value = ''; });
$('#ownClear').addEventListener('click', () => Sound.clearOwn());
document.addEventListener('click', e => { const p = $('#soundPanel'); if (!p.hidden && !e.target.closest('#soundPanel') && !e.target.closest('#soundBtn')) p.hidden = true; });
// browsers only allow sound after a click, so pick up a saved "on" setting at the first one
document.addEventListener('pointerdown', function first(){ document.removeEventListener('pointerdown', first, true); if (Sound.pref.on && !Sound.playing) Sound.start(); }, true);
$('#screen').addEventListener('click', e => { if (e.target.closest('.key')) Sound.tap(); });
syncSoundUI();
</script>
</html>
